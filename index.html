<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECHO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#e9eef4;
    --ink-dim:rgba(233,238,244,.82);
    --bg-deep:#0b1118;
    --mx:0; --my:0;
    --s:1; --camx:0;   /* 关卡世界缩放 / 镜头横向位移，由关卡循环写入 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--bg-deep);
    font-family:'Josefin Sans','Segoe UI','Microsoft YaHei',sans-serif;
    font-weight:300;
    color:var(--ink);
    user-select:none;
    cursor:default;
  }

  .stage{position:fixed;inset:0;overflow:hidden;
    background:
      radial-gradient(120vmax 90vmax at 47% 46%, #2c3949 0%, #232f3d 30%, #18222e 55%, #0e151f 78%, #080d14 100%);
  }

  /* ---------- moon ---------- */
  .moon-wrap{
    position:absolute;left:47%;top:46%;
    width:138vmin;height:138vmin;
    transform:translate(calc(-50% + var(--mx) * 0.4px + var(--camx) * -0.05px), calc(-50% + var(--my) * 0.4px));
  }
  .moon{
    position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 46% 40%, #55677c 0%, #48596d 26%, #3a4a5c 48%, #2d3b4b 66%, #22303f 80%, #1b2836 88%, rgba(27,40,54,.0) 100%);
    box-shadow:0 0 140px 20px rgba(110,140,175,.14), 0 0 420px 60px rgba(90,120,155,.10);
    overflow:hidden;
  }
  .moon::before{ /* mottled surface */
    content:"";position:absolute;inset:-2%;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.012 0.017' numOctaves='4' seed='7' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='700' height='700' filter='url(%23m)'/></svg>");
    background-size:130%;
    mix-blend-mode:soft-light;opacity:.75;
    -webkit-mask-image:radial-gradient(circle at 50% 50%, #000 62%, transparent 72%);
            mask-image:radial-gradient(circle at 50% 50%, #000 62%, transparent 72%);
  }
  .moon::after{ /* inner shading, darker lower limb */
    position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 50% 118%, rgba(10,16,24,.55) 0%, rgba(10,16,24,.18) 42%, transparent 62%),
      radial-gradient(circle at 108% 50%, rgba(10,16,24,.28) 0%, transparent 45%);
  }

  /* 环绕月亮的微光卫星：容器是月亮中心的一个零点，靠旋转把圆点甩出去成轨道 */
  .moon-orbit{position:absolute;left:50%;top:50%;width:0;height:0;
    animation:orbit 30s linear infinite}
  .moon-orbit::before{content:"";position:absolute;left:-40vmin;top:-40vmin;width:80vmin;height:80vmin;
    border-radius:50%;border:1px solid rgba(223,233,245,.11)}
  .moon-orbit i{position:absolute;left:40vmin;top:-2.5px;width:5px;height:5px;border-radius:50%;
    background:#f2f6fb;
    box-shadow:0 0 10px 2px rgba(200,225,255,.7), 0 0 3px rgba(255,255,255,.95)}
  @keyframes orbit{to{transform:rotate(360deg)}}
  /* clouds drifting across the moon */
  .clouds{position:absolute;inset:0;transform:translate(calc(var(--camx) * -0.08px), 0)}
  .cloud{position:absolute;pointer-events:none;filter:blur(26px);border-radius:50%}
  .cloud.c1{left:-30%;top:34%;width:170%;height:20%;
    background:radial-gradient(ellipse at 50% 50%, rgba(150,175,205,.13), rgba(150,175,205,0) 70%);
    animation:drift 95s linear infinite alternate}
  .cloud.c2{left:-40%;top:56%;width:190%;height:24%;
    background:radial-gradient(ellipse at 40% 50%, rgba(125,150,182,.16), rgba(125,150,182,0) 68%);
    animation:drift 130s linear infinite alternate-reverse}
  .cloud.c3{left:-20%;top:14%;width:150%;height:16%;
    background:radial-gradient(ellipse at 60% 50%, rgba(140,165,198,.09), rgba(140,165,198,0) 70%);
    animation:drift 160s linear infinite alternate}
  @keyframes drift{from{transform:translateX(-4%)}to{transform:translateX(7%)}}

  /* ---------- ruins / silhouettes ---------- */
  /* 背景由三段不同构图连续拼成，总宽 4800、高 900，与关卡同一量纲：随镜头以 0.55 的速度滑动 */
  .ruins{position:absolute;left:0;top:0;width:4800px;height:900px;
    transform-origin:0 0;
    transform:scale(var(--s)) translate(calc(var(--camx) * -0.55px + var(--mx) * 0.9px), calc(var(--my) * 0.9px))}
  .ruins svg{width:100%;height:100%;display:block}

  /* ---------- vignette + grain ---------- */
  .vignette{position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(120% 100% at 50% 46%, transparent 52%, rgba(6,10,16,.55) 86%, rgba(4,7,11,.82) 100%),
      linear-gradient(180deg, rgba(5,9,14,.35) 0%, transparent 18% 76%, rgba(4,7,11,.45) 100%);
  }
  .grain{position:absolute;inset:-60px;pointer-events:none;opacity:.055;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' seed='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='280' height='280' filter='url(%23g)'/></svg>");
    animation:grain 1.2s steps(4) infinite}
  @keyframes grain{
    0%{transform:translate(0,0)}25%{transform:translate(-24px,14px)}
    50%{transform:translate(14px,-20px)}75%{transform:translate(-10px,-8px)}100%{transform:translate(0,0)}
  }

  /* ---------- snow : 标题界面的飘落粒子 ---------- */
  /* 外层负责左右摇摆、内层负责下落，两层动画叠加才有飘的感觉 */
  .snow{position:absolute;inset:0;overflow:hidden;pointer-events:none;
    transform:translate(calc(var(--mx) * -0.8px), calc(var(--my) * -0.8px))}
  .flake{position:absolute;top:0;animation:sway ease-in-out infinite alternate}
  .flake i{display:block;border-radius:50%;animation:fall linear infinite;
    background:radial-gradient(circle at 36% 32%, rgba(255,255,255,.95), rgba(216,233,253,.6) 52%, rgba(190,215,245,0) 74%)}
  @keyframes fall{from{transform:translateY(-16vh)}to{transform:translateY(116vh)}}
  @keyframes sway{from{transform:translateX(-16px)}to{transform:translateX(16px)}}

  /* 雪花在关卡内保留（不再隐藏），只是去掉它的鼠标视差，见下方 body.playing 段 */

  /* ---------- level : 关卡世界 / 玩家 / 检查点 / HUD ---------- */
  .world{position:absolute;inset:0;display:none;overflow:hidden}
  body.playing .world{display:block}
  /* 关卡进行中收起标题与菜单：用 visibility，避免被 title 的淡入动画 fill 覆盖 */
  body.playing .title,body.playing .menu{visibility:hidden;pointer-events:none}
  .world-inner{position:absolute;left:0;top:0;width:3200px;height:900px;
    transform-origin:0 0;
    transform:scale(var(--s)) translate(calc(var(--camx) * -1px), 0)}
  .world-inner svg{width:100%;height:100%;display:block}

  .abyss{fill:url(#pitGrad)}
  .slab-g{fill:#0b1219}
  .slab-f{fill:#0c141d}
  .edge{stroke:#4a5e74;stroke-width:2;opacity:.45}
  .edge-dim{stroke:#42556a;stroke-width:2;opacity:.22}

  .cp-post{stroke:rgba(190,215,245,.26);stroke-width:2}
  /* 出生点立柱只在开场"卡住"阶段当提示的杆子出现：落地的瞬间浮现，挣脱的瞬间消失 */
  #spawnPost{opacity:0;transition:opacity .3s ease}
  .stage.intro-stuck #spawnPost{opacity:1}
  .cp-ring{fill:none;stroke:rgba(190,215,245,.32);stroke-width:2.4}
  .cp-dot{fill:rgba(220,238,255,.26)}
  .cp.on .cp-post{stroke:rgba(190,215,245,.55)}
  .cp.on .cp-ring{stroke:#dceaff;animation:cpPulse 2.6s ease-in-out infinite}
  .cp.on .cp-dot{fill:#eaf2fb}
  @keyframes cpPulse{0%,100%{opacity:.5}50%{opacity:1}}

  /* 记录点：碰触瞬间的一次性亮起（外扩白光环） */
  .cp-flash{fill:none;stroke:#eaf4ff;stroke-width:2;opacity:0;
    transform-box:fill-box;transform-origin:center}
  .cp.lit .cp-flash{animation:cpFlash .85s cubic-bezier(.2,.8,.3,1)}
  @keyframes cpFlash{
    0%{transform:scale(.35);opacity:.95}
    70%{opacity:.22}
    100%{transform:scale(2.5);opacity:0}
  }
  /* 记录点：激活后周围持续漂浮的发光白色粒子。每个粒子两层圆（外圈光晕 + 内芯）做柔光 */
  .cp-p{display:none}
  .cp.on .cp-p{display:block;animation:cpFloat var(--dur,4.4s) linear infinite;
    animation-delay:var(--del,0s)}
  .cp-p circle{fill:#fff}
  @keyframes cpFloat{
    0%{transform:translate(var(--x),var(--y));opacity:0}
    22%{opacity:1}
    72%{opacity:.7}
    100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--dy)));opacity:0}
  }

  /* 掉进虚空：粒子爆炸 + 冲击环 */
  .fx-p circle{fill:#fff}
  .fx-ring{fill:none;stroke:#eaf4ff;stroke-width:2}

  /* 终点信标（无文字）：柔光晕 + 缓转的虚线外环 + 对位刻度 + 核心亮点 + 柱内缓升光点 */
  .goal-beam{fill:url(#goalGrad)}
  .goal-halo{fill:url(#goalGlow)}
  .goal-dash{fill:none;stroke:rgba(200,225,255,.34);stroke-width:1.6;
    stroke-dasharray:3 9;stroke-linecap:round}
  .goal-spin{transform-box:fill-box;transform-origin:center;
    animation:goalSpin 26s linear infinite}
  @keyframes goalSpin{to{transform:rotate(360deg)}}
  .goal-tick{stroke:rgba(200,225,255,.45);stroke-width:1.6;stroke-linecap:round}
  .goal-ring{fill:none;stroke:rgba(200,225,255,.5);stroke-width:2.6}
  .goal-ring-in{fill:none;stroke:rgba(200,225,255,.16);stroke-width:1.2}
  .goal-core{fill:#eaf4ff;opacity:.85}
  .goal-mote{animation:cpFloat var(--dur,4.4s) linear infinite;animation-delay:var(--del,0s)}
  .goal-mote circle{fill:#fff}
  .goal.on .goal-ring{stroke:#f2f6fb;animation:cpPulse 1.5s ease-in-out infinite}
  .goal.on .goal-core{opacity:1}

  /* 玩家：白色小方块 + 一只黑眼睛；眼睛朝向跟随移动方向，并时不时眨一下 */
  .hero-body{fill:#f2f6fb}
  .hero-eye{fill:#0b1219;transform-box:fill-box;transform-origin:center;
    animation:blink 5.4s ease-in-out infinite}
  /* 朝向与眨眼分属两层元素，避免两处 transform 互相覆盖 */
  .eye-wrap{transition:transform .13s ease}
  #hero[data-face="right"] .eye-wrap{transform:translateX(6px)}
  #hero[data-face="left"]  .eye-wrap{transform:translateX(-6px)}
  @keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.14)}}
  #hero{filter:drop-shadow(0 0 7px rgba(185,210,245,.45))}
  /* 挣脱后晕眩：眼睛换成 X */
  .x-eye{display:none}
  #hero.dizzy .hero-eye{display:none}
  #hero.dizzy .x-eye{display:block}
  /* "朝上"表情：换成两只贴在方块上部的眼睛（习得二段跳的过场里用） */
  .up-eye{display:none}
  #hero[data-face="up"] .eye-wrap{display:none}
  #hero[data-face="up"] .up-eye{display:block}
  /* 石块层：静置一段时间后整体淡出 */
  #stones{transition:opacity .8s ease}
  #stones.stones-fade{opacity:0}

  /* 过场：整屏震动（挣脱瞬间） */
  .stage.quake{animation:quake .58s cubic-bezier(.36,.07,.19,.97)}
  @keyframes quake{
    0%,100%{transform:translate(0,0)}
    10%{transform:translate(-7px,5px)}
    22%{transform:translate(6px,-6px)}
    35%{transform:translate(-5px,-4px)}
    48%{transform:translate(5px,4px)}
    62%{transform:translate(-4px,3px)}
    76%{transform:translate(3px,-2px)}
    88%{transform:translate(-2px,1px)}
  }
  /* 过场镜头层：缩放 + 平移，实现"推近到主角身上"的运镜 */
  .cam{position:absolute;inset:0;transform-origin:0 0;
    transform:scale(var(--zoom,1)) translate(var(--camtx,0px), var(--camty,0px))}
  /* 虚空提示：仍是屏幕下方居中的浮层 */
  .intro-hint{position:fixed;left:50%;bottom:15%;z-index:12;
    font-size:11.5px;letter-spacing:.32em;color:rgba(224,238,252,.8);
    padding:9px 20px;border:1px solid rgba(160,190,225,.2);border-radius:2px;
    background:rgba(8,13,20,.55);transform:translateX(-50%);
    opacity:0;pointer-events:none;transition:opacity .3s ease}
  .intro-hint.show{opacity:1;animation:hintPulse 1.9s ease-in-out infinite}
  .intro-hint b{color:var(--ink);font-weight:400}
  /* 过场结束后的章节标题：贴在背景里（世界坐标，随镜头缩放/推拉），字体沿用同一套 */
  .chapter{position:absolute;z-index:11;transform:translateX(-50%);   /* left/bottom 由 JS 按世界坐标给 */
    pointer-events:none;opacity:0;transition:opacity .8s ease}
  .chapter.show{opacity:1}
  .chapter span{font-size:40px;font-weight:300;letter-spacing:.4em;margin-right:-.4em;
    color:var(--ink);text-shadow:0 0 18px rgba(200,225,255,.45);white-space:nowrap}
  /* 过场"卡住"提示：文字停在出生点标杆的顶端（沿用主菜单那套字体：宽字距 + 细体 + 微光） */
  .lead{position:absolute;z-index:12;display:flex;flex-direction:column;align-items:center;
    transform:translateX(-50%);           /* left 给的是标杆所在竖线，这里把文字摆正到线上 */
    pointer-events:none;opacity:0;transition:opacity .3s ease}
  .lead.show{opacity:1;animation:hintPulse 1.9s ease-in-out infinite}
  .lead-txt{font-size:7.5px;font-weight:300;letter-spacing:.34em;text-transform:uppercase;
    margin-right:-.34em;                 /* 抵消字距留在末尾的空隙，让文字真正对齐竖线 */
    color:var(--ink);text-shadow:0 0 12px rgba(200,225,255,.45);white-space:nowrap}
  @keyframes hintPulse{0%,100%{opacity:.6}50%{opacity:1}}

  .hud{position:fixed;left:5.2%;top:4.6%;z-index:20;display:none;
    flex-direction:column;gap:8px;pointer-events:none}
  body.playing .hud{display:flex}
  .hud span{font-size:10px;letter-spacing:.3em;color:rgba(188,212,240,.42);white-space:nowrap}
  .hud b{font-weight:300;color:rgba(222,234,248,.72)}

  /* 二段跳冷却条：习得后出现在左下角；条满=可用，用掉后 0.5s 回填 */
  .dj-bar{position:fixed;left:5.2%;bottom:6.4%;z-index:20;display:none;
    flex-direction:column;gap:6px;pointer-events:none;opacity:0;transition:opacity .5s ease}
  body.playing.dj .dj-bar{display:flex}
  .dj-bar.show{opacity:1}
  .dj-label{font-size:9px;letter-spacing:.34em;color:rgba(188,212,240,.42);white-space:nowrap}
  .dj-track{width:86px;height:2px;background:rgba(188,212,240,.16)}
  .dj-track i{display:block;height:100%;width:100%;background:#eaf4ff;
    box-shadow:0 0 8px rgba(200,225,255,.55)}

  /* 习得提示：固定在屏幕正中的一行字 */
  .learn-tag{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:41;
    pointer-events:none;opacity:0;transition:opacity .7s ease}
  .learn-tag.show{opacity:1}
  .learn-tag span{font-size:34px;font-weight:300;letter-spacing:.4em;margin-right:-.4em;
    color:var(--ink);text-shadow:0 0 22px rgba(200,225,255,.5);white-space:nowrap}

  /* 白光爆炸：过场里的一层全屏白幕 */
  .whiteout{position:fixed;inset:0;z-index:42;background:#fff;opacity:0;
    pointer-events:none;transition:opacity .22s ease}
  .whiteout.on{opacity:1}

  /* 终点大门：门扇开启时向上收进楣石 */
  .gate-door{fill:#05080d;transform-box:fill-box;transform-origin:50% 0;
    transition:transform .9s cubic-bezier(.22,.8,.3,1)}
  .gate.open .gate-door{transform:scaleY(0)}

  .fade.quick{transition-duration:.18s}

  /* 进入关卡后：背景完全静止——无自主动画、无鼠标视差、也不随镜头滚动（世界/地形照旧滚动） */
  body.playing .grain{animation:none}
  body.playing .cloud{animation:none}
  body.playing .moon-orbit{animation:none}
  body.playing .moon-wrap{transform:translate(-50%, -50%)}   /* 月亮：去掉鼠标视差与镜头漂移 */
  body.playing .clouds{transform:none}
  body.playing .ruins{transform:scale(var(--s))}             /* 保留与世界同步的缩放，去掉横向漂移 */
  body.playing .snow{transform:none}                         /* 雪花继续飘落，但不再跟随鼠标 */

  @media (prefers-reduced-motion: reduce){
    .snow{display:none}
    .moon-orbit{animation:none}
    .hero-eye{animation:none}
    .stage.quake{animation:none}
    .intro-hint.show{animation:none;opacity:1}
    .lead.show{animation:none;opacity:1}
    .cp.lit .cp-flash{animation:none}
    .cp.on .cp-p{display:none}
    .goal-spin{animation:none}
    .goal-mote{display:none}
    .whiteout.on{opacity:.55}
    .item.knock .ind svg,.item.knock .ind .tick{animation:none}
  }

  /* ---------- title ---------- */
  .title{
    position:absolute;left:50%;top:42.5%;
    transform:translate(calc(-50% + var(--mx)*-0.5px), calc(-50% + var(--my)*-0.5px));
    width:clamp(300px,37vw,600px);
    filter:drop-shadow(0 0 7px rgba(185,210,245,.35)) drop-shadow(0 0 26px rgba(140,175,225,.18));
  }
  /* 开场黑幕（.fade，z-index 40）还盖着时，标题要先浮在黑幕之上；黑幕散尽后 body.enter 被摘掉，标题落回原层级 */
  body.enter .title{z-index:41}
  .title svg{width:100%;height:auto;display:block;overflow:visible}
  .glyph{fill:none;stroke:#f2f6fb;stroke-width:2.6;stroke-linecap:round;opacity:.96}
  .ring{fill:none;stroke:#dfe9f5}
  /* 标题不做整体淡入；四个字母同时起笔，笔画由 JS 推进 stroke-dashoffset 一笔一划"写"出来 */

  /* ---------- menu ---------- */
  .menu{
    position:absolute;left:5.2%;bottom:7.5%;
    display:flex;flex-direction:column;gap:9px;
    animation:menuIn 1.1s 1.1s cubic-bezier(.22,.8,.3,1) both;   /* 延迟由 JS 按开场节奏覆盖：画面渐显时才滑入 */
  }
  @keyframes menuIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .item{
    display:flex;align-items:center;
    background:none;border:0;padding:2px 0;
    font-family:inherit;font-weight:300;
    font-size:14px;letter-spacing:.30em;text-transform:uppercase;
    color:var(--ink-dim);cursor:pointer;
    transition:color .25s ease, text-shadow .25s ease, transform .25s ease;
  }
  .item:nth-child(1){margin-left:0}
  .item:nth-child(2){margin-left:22px}
  .item:nth-child(3){margin-left:58px}
  .item:nth-child(4){margin-left:94px}
  .item:nth-child(5){margin-left:130px}
  .item:hover,.item.active{color:#ffffff;text-shadow:0 0 12px rgba(200,225,255,.45)}
  .item:focus{outline:none}
  /* 鼠标悬停向右偏移一点，按下再多一点 */
  .item:hover{transform:translateX(5px)}
  .item:active{transform:translateX(9px)}
  .ind{
    display:inline-flex;align-items:center;gap:11px;
    margin-left:15px;height:14px;
    opacity:0;transform:translateX(-8px);
    transition:opacity .3s ease, transform .3s cubic-bezier(.22,.8,.3,1);
  }
  .item.active .ind{opacity:1;transform:none}
  .ind svg{width:13px;height:13px;display:block;opacity:.9}
  .ind .tick{width:52px;height:1px;background:currentColor;opacity:.85}
  /* 点击：线向左撞到球上，球被顶开后归位（各只动一次，不来回震） */
  .item.knock .ind .tick{animation:tickJab .36s cubic-bezier(.3,.9,.3,1) both}
  .item.knock .ind svg{animation:ballKnock .44s cubic-bezier(.3,.9,.3,1) both}
  @keyframes tickJab{
    0%{transform:translateX(0)}
    22%{transform:translateX(-11px)}     /* 一次顶到球上（间距 11px） */
    100%{transform:translateX(0)}
  }
  @keyframes ballKnock{
    0%,14%{transform:translateX(0) scale(1)}
    42%{transform:translateX(-7px) scale(1.07)}    /* 被撞开一次 */
    100%{transform:translateX(0) scale(1)}
  }

  /* ---------- fade / transition ---------- */
  .fade{position:fixed;inset:0;z-index:40;background:#04070b;opacity:0;pointer-events:none;transition:opacity .5s ease}
  .fade.on{opacity:1;pointer-events:auto}
  .fade-inner{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
    opacity:0;transition:opacity .7s ease .28s;
  }
  .fade.on .fade-inner{opacity:1}
  .fade .msg{font-size:12px;letter-spacing:.5em;color:rgba(222,234,248,.62);white-space:nowrap}
  .fade .sub{font-size:10px;letter-spacing:.3em;color:rgba(188,212,240,.3);white-space:nowrap}
  /* 通关结算：三行数据，只在打完一章时出现 */
  .fade-stats{display:none;flex-direction:column;gap:10px;margin-top:12px;
    padding-top:16px;border-top:1px solid rgba(150,180,215,.16);min-width:232px}
  .fade-stats.show{display:flex}
  .fade-stats .row{display:flex;justify-content:space-between;gap:34px;
    font-size:10px;letter-spacing:.3em}
  .fade-stats .row b{font-weight:300;color:rgba(188,212,240,.34)}
  .fade-stats .row i{font-style:normal;color:rgba(222,234,248,.8)}

  /* ---------- overlay : saves / settings / confirm ---------- */
  .overlay{
    position:fixed;inset:0;z-index:30;
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .38s ease;
  }
  .overlay.on{opacity:1;pointer-events:auto}
  .veil{
    position:absolute;inset:0;
    background:radial-gradient(130% 100% at 50% 44%, rgba(8,13,20,.5) 0%, rgba(4,7,11,.88) 100%);
    -webkit-backdrop-filter:blur(8px) saturate(.85);
            backdrop-filter:blur(8px) saturate(.85);
  }
  .panel{
    position:relative;display:none;
    width:clamp(330px,44vw,600px);
  }
  .panel.show{display:block}

  /* 出场引导标记：上下两个点 + 一条竖线 */
  .panel-mark{position:absolute;left:-13px;top:0;bottom:0;width:1px;pointer-events:none;opacity:0;
    transition:opacity .3s ease}
  .mk-line{position:absolute;left:0;top:7px;bottom:7px;width:1px;
    background:linear-gradient(180deg, rgba(198,224,252,.05), rgba(198,224,252,.55), rgba(198,224,252,.05));
    transform:scaleY(0);transform-origin:center;
    transition:transform .36s cubic-bezier(.22,.8,.3,1)}
  .mk-dot{position:absolute;left:-2.5px;width:6px;height:6px;border-radius:50%;
    background:#dceaff;box-shadow:0 0 10px rgba(170,205,245,.85), 0 0 3px rgba(220,238,255,.9);
    transform:scale(0);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
  .mk-top{top:0}.mk-bot{bottom:0}

  /* 面板主体（含底色/描边/角饰），从竖线处向右拉开 */
  .panel-wipe{position:relative;
    background:linear-gradient(158deg, rgba(22,32,45,.84), rgba(9,15,23,.93));
    border:1px solid rgba(160,190,225,.14);
    box-shadow:0 36px 100px rgba(0,0,0,.62), 0 0 80px rgba(115,155,208,.08), inset 0 1px 0 rgba(215,235,255,.06);
    clip-path:inset(0 100% 0 0);
    transition:clip-path .56s cubic-bezier(.22,.8,.3,1)}
  /* 内容区独立滚动，装饰角固定不动 */
  .panel-body{
    max-height:86vh;overflow-y:auto;padding:28px 38px 20px;
    scrollbar-width:none;-ms-overflow-style:none;
    opacity:0;transform:translateX(26px);
    transition:opacity .42s ease, transform .52s cubic-bezier(.22,.8,.3,1)}
  .panel-body::-webkit-scrollbar{width:0;height:0;display:none}
  .panel-frame{ /* corner brackets */
    position:absolute;inset:8px;pointer-events:none;opacity:0;
    transition:opacity .4s ease;
    background:
      linear-gradient(rgba(200,226,255,.42),rgba(200,226,255,.42)) left top/16px 1px no-repeat,
      linear-gradient(rgba(200,226,255,.42),rgba(200,226,255,.42)) left top/1px 16px no-repeat,
      linear-gradient(rgba(200,226,255,.42),rgba(200,226,255,.42)) right top/16px 1px no-repeat,
      linear-gradient(rgba(200,226,255,.42),rgba(200,226,255,.42)) right top/1px 16px no-repeat,
      linear-gradient(rgba(200,226,255,.42),rgba(200,226,255,.42)) left bottom/16px 1px no-repeat,
      linear-gradient(rgba(200,226,255,.42),rgba(200,226,255,.42)) left bottom/1px 16px no-repeat,
      linear-gradient(rgba(200,226,255,.42),rgba(200,226,255,.42)) right bottom/16px 1px no-repeat,
      linear-gradient(rgba(200,226,255,.42),rgba(200,226,255,.42)) right bottom/16px 1px no-repeat;
  }

  .overlay.on .panel.show .slot{animation-play-state:running}
  /* 开启动画时序：点 → 竖线 → 面板向右拉开 → 内容/角饰浮现 */
  .overlay.on .panel.show .panel-mark{opacity:1;transition-delay:.06s}
  .overlay.on .panel.show .mk-top{transform:scale(1);transition-delay:.06s}
  .overlay.on .panel.show .mk-bot{transform:scale(1);transition-delay:.12s}
  .overlay.on .panel.show .mk-line{transform:scaleY(1);transition-delay:.2s}
  .overlay.on .panel.show .panel-wipe{clip-path:inset(0 0 0 0);transition-delay:.38s}
  .overlay.on .panel.show .panel-body{opacity:1;transform:none;transition-delay:.5s}
  .overlay.on .panel.show .panel-frame{opacity:.55;transition-delay:.56s}
  /* 关闭时无延迟，立刻回收 */
  .overlay:not(.on) .panel .panel-mark,
  .overlay:not(.on) .panel .mk-line,
  .overlay:not(.on) .panel .mk-dot,
  .overlay:not(.on) .panel .panel-wipe,
  .overlay:not(.on) .panel .panel-body,
  .overlay:not(.on) .panel .panel-frame{transition-delay:0s}

  /* 面板之间切换：当前面板收合（无延迟、稍快），收完再展开新面板 */
  .overlay.closing{pointer-events:none}
  .overlay.closing .panel.show .panel-mark{opacity:0;transition-delay:0s;transition-duration:.24s}
  .overlay.closing .panel.show .mk-top,
  .overlay.closing .panel.show .mk-bot{transform:scale(0);transition-delay:0s;transition-duration:.2s}
  .overlay.closing .panel.show .mk-line{transform:scaleY(0);transition-delay:0s;transition-duration:.26s}
  .overlay.closing .panel.show .panel-wipe{clip-path:inset(0 100% 0 0);transition-delay:0s;transition-duration:.42s}
  .overlay.closing .panel.show .panel-body{opacity:0;transform:translateX(26px);transition-delay:0s;
    transition-duration:.26s,.34s}
  .overlay.closing .panel.show .panel-frame{opacity:0;transition-delay:0s;transition-duration:.24s}

  .p-head{display:flex;align-items:baseline;gap:14px}
  .p-cn{font-size:19px;letter-spacing:.34em;color:#f3f7fc;text-shadow:0 0 18px rgba(180,212,248,.3)}
  .p-en{font-size:9.5px;letter-spacing:.42em;color:rgba(198,222,248,.36)}
  .p-rule{height:1px;margin:12px 0 15px;
    background:linear-gradient(90deg, rgba(184,212,242,.36), rgba(184,212,242,.07) 62%, rgba(184,212,242,0))}

  /* save slots */
  .slot{
    --i:0;--o:1;
    position:relative;display:flex;align-items:center;gap:15px;width:100%;
    padding:11px 16px;margin-bottom:8px;
    background:linear-gradient(90deg, rgba(150,185,225,.055), rgba(150,185,225,.015) 62%, rgba(150,185,225,0));
    border:1px solid rgba(150,185,225,.1);border-left:2px solid rgba(150,185,225,.16);
    font-family:inherit;font-weight:300;color:var(--ink-dim);text-align:left;cursor:pointer;
    opacity:var(--o,1);transform:none;
    animation:slotIn .55s cubic-bezier(.22,.8,.3,1) calc(var(--i) * 70ms + 560ms) backwards;
    animation-play-state:paused;
    transition:background .25s ease, border-color .25s ease, color .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  @keyframes slotIn{from{opacity:0;transform:translateX(-12px)}to{opacity:var(--o,1);transform:none}}
  .slot:hover,.slot.on{
    background:linear-gradient(90deg, rgba(165,200,238,.12), rgba(165,200,238,.03) 62%, rgba(165,200,238,0));
    border-color:rgba(180,210,245,.32);border-left-color:rgba(215,235,255,.62);
    color:#fff;transform:translateX(3px);
    box-shadow:0 0 26px rgba(130,168,220,.14), inset 0 0 26px rgba(140,178,230,.06);
  }
  .slot.empty{--o:.45}
  .slot[disabled]{cursor:not-allowed}
  .slot.empty:hover{
    background:linear-gradient(90deg, rgba(150,185,225,.055), rgba(150,185,225,0) 62%);
    border-color:rgba(150,185,225,.1);border-left-color:rgba(150,185,225,.16);
    color:var(--ink-dim);transform:none;box-shadow:none;
  }
  .s-no{min-width:26px;font-size:15px;letter-spacing:.16em;color:rgba(214,232,252,.6)}
  .slot.on .s-no{color:#fff;text-shadow:0 0 14px rgba(190,220,255,.5)}
  .s-main{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px}
  .s-name{font-size:13.5px;letter-spacing:.24em;white-space:nowrap}
  .s-meta{font-size:10.5px;letter-spacing:.16em;color:rgba(186,212,240,.4)}
  /* 右侧标签组：读取/覆盖 + 删除，两个小方块贴在一起 */
  .s-acts{display:flex;align-items:center;gap:6px;flex:none}
  .s-tag{padding:3px 9px;border:1px solid rgba(150,185,225,.16);font-size:10px;letter-spacing:.28em;color:rgba(186,212,240,.38)}
  .slot.on .s-tag{color:rgba(226,240,255,.85);border-color:rgba(190,218,250,.42)}
  /* 删除存档：与标签同款的小方块，紧贴标签右侧 */
  .s-del{flex:none;padding:3px 9px;border:1px solid rgba(150,185,225,.16);font-size:10px;letter-spacing:.28em;
    color:rgba(186,212,240,.32);white-space:nowrap;cursor:pointer;
    transition:color .22s ease, border-color .22s ease, background .22s ease}
  .slot.on .s-del{color:rgba(226,240,255,.78);border-color:rgba(190,218,250,.34)}
  .s-del:hover{color:#fff;border-color:rgba(196,222,252,.45);background:rgba(160,196,236,.12)}

  /* empty state（注意：不要用 .empty，会和空存档位 .slot.empty 冲突） */
  .s-empty,.empty-state{flex-direction:column;align-items:center;gap:12px;padding:20px 0 6px;text-align:center}
  .s-empty{display:none}
  .empty-state{display:flex}
  .empty-state svg,.s-empty svg{opacity:.5}
  .empty-state p,.s-empty p{font-size:13px;letter-spacing:.3em;color:rgba(222,236,250,.7)}
  .empty-state span,.s-empty span{font-size:9.5px;letter-spacing:.4em;color:rgba(186,212,240,.3)}

  /* buttons + hints */
  .p-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}
  .btn{
    padding:10px 24px;background:rgba(150,185,225,.04);border:1px solid rgba(160,190,225,.18);
    font-family:inherit;font-weight:300;font-size:12px;letter-spacing:.26em;color:var(--ink-dim);cursor:pointer;
    transition:color .25s ease, border-color .25s ease, background .25s ease, box-shadow .25s ease, transform .18s ease;
  }
  .btn:hover,.btn.on{color:#fff;border-color:rgba(196,222,252,.42);background:rgba(160,196,236,.1);box-shadow:0 0 24px rgba(130,170,222,.2)}
  .btn.primary{color:#e8f1fb;border-color:rgba(180,210,246,.34);background:rgba(160,196,236,.08)}
  .btn:active{transform:translateX(1px)}
  .c-desc{font-size:12.5px;line-height:1.9;letter-spacing:.14em;color:rgba(214,230,246,.78)}

  /* about : 版本信息表 */
  .a-row{display:flex;align-items:baseline;gap:16px;padding:11px 0;
    border-bottom:1px solid rgba(160,190,225,.1)}
  .a-row:last-child{border-bottom:0}
  .a-k{min-width:74px;font-size:10.5px;letter-spacing:.3em;color:rgba(186,212,240,.45)}
  .a-v{font-size:14px;letter-spacing:.16em;color:var(--ink)}
  .p-foot{display:flex;gap:20px;margin-top:14px;font-size:10px;letter-spacing:.22em;color:rgba(186,212,240,.34)}
  .p-foot b{font-weight:400;color:rgba(216,236,255,.62)}

  /* 窗口偏矮时收紧排版，避免面板内部出现滚动 */
  @media (max-height:780px){
    .p-foot{display:none}
    .panel-body{padding:22px 30px 16px}
    .p-rule{margin:10px 0 12px}
    .slot{padding:9px 14px;margin-bottom:6px}
    .s-name{font-size:12.5px}
    .s-meta{font-size:9.5px}
    .p-actions{margin-top:12px}
    .s-empty{padding:12px 0 2px}
    .a-row{padding:8px 0}
  }

  @media (max-width:760px){
    .item{font-size:12px}
    .item:nth-child(2){margin-left:14px}
    .item:nth-child(3){margin-left:36px}
    .item:nth-child(4){margin-left:70px}
    .item:nth-child(5){margin-left:104px}
    .title{width:64vw}
    .panel{width:88vw}
    .panel-body{padding:26px 22px 18px}
    .p-cn{font-size:17px;letter-spacing:.26em}
    .p-en{font-size:8.5px;letter-spacing:.3em}
    .s-name{font-size:12.5px;letter-spacing:.18em}
    .s-meta{font-size:9.5px;letter-spacing:.08em}
    .s-tag,.s-del{font-size:9px;letter-spacing:.2em}
    .btn{padding:9px 18px;font-size:11px;letter-spacing:.2em}
    .p-foot{font-size:9px;gap:12px}
    .c-desc{font-size:11.5px}
  }
</style>

<script>
  // ---------- parallax ----------
  const stage = document.getElementById('stage');
  let tx = 0, ty = 0, cx = 0, cy = 0;
  window.addEventListener('mousemove', e => {
    tx = (e.clientX / window.innerWidth  - .5) * 2;
    ty = (e.clientY / window.innerHeight - .5) * 2;
  });
  (function loop(){
    cx += (tx - cx) * .05;
    cy += (ty - cy) * .05;
    stage.style.setProperty('--mx', cx.toFixed(3) * 14);
    stage.style.setProperty('--my', cy.toFixed(3) * 10);
    requestAnimationFrame(loop);
  })();

  // 雪花：按视口宽度生成适量粒子，动画全部交给 CSS（不进 rAF 循环，避免多一份每帧开销）
  (function snow(){
    const wrap = document.getElementById('snow');
    const n = Math.min(130, Math.max(40, Math.round(window.innerWidth / 17)));
    for(let i = 0; i < n; i++){
      const r = (a, b) => a + Math.random() * (b - a);
      const flake = document.createElement('span');
      const dot = document.createElement('i');
      const size = r(1.4, 4.4);          // 尺寸差异就是远近层次
      flake.className = 'flake';
      flake.style.left = r(-2, 101).toFixed(2) + '%';
      flake.style.animationDuration = r(3, 7.5).toFixed(2) + 's';
      flake.style.animationDelay = (-r(0, 7.5)).toFixed(2) + 's';
      dot.style.width = dot.style.height = size.toFixed(1) + 'px';
      dot.style.opacity = (size > 3.9 ? r(.3, .5) : r(.18, .68)).toFixed(2);
      dot.style.animationDuration = r(9, 19).toFixed(2) + 's';
      dot.style.animationDelay = (-r(0, 19)).toFixed(2) + 's';
      if(size > 3.9) dot.style.filter = 'blur(1.3px)';   // 偏大的当作近景，虚一点
      flake.appendChild(dot);
      wrap.appendChild(flake);
    }
  })();

  // 进入主菜单的开场：黑幕先罩住画面，ECHO 四个字母同时起笔、各自一笔一划写完，停一拍后黑幕渐隐露出场景
  const ENTER = {
    startAt: 0.30,     // 全部笔画同时起笔的时刻（秒）
    speed: 190,        // 书写速度（路径单位/秒）
    minDur: 0.16,      // 单笔最短时长，避免短笔一帧就画完
    hold: 0.18,        // 标题写完后、黑幕开始渐隐前的停顿（秒）
    menuLag: 0.12,     // 画面开始渐显后，菜单项再滑入的延迟（秒）
    fadeDur: 0.85      // 黑幕渐隐时长（秒）
  };
  (function enterTitle(){
    const strokes = [...document.querySelectorAll('.title .glyph path, .title .glyph circle')];
    const fadeEl = document.getElementById('fade');
    if(!strokes.length) return;

    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let end = ENTER.startAt;                       // 最后一笔写完的时刻
    strokes.forEach(el => {
      let L = 0;
      try { L = el.getTotalLength(); } catch(e){ L = 0; }
      if(!(L > 0)) L = 260;                        // 兜底：量不到长度时按估算值走
      el.style.strokeDasharray = L;
      el.style.strokeDashoffset = reduce ? 0 : L;  // 起手前先"没写"；关闭动效时直接给完整标题
      if(reduce) return;
      const dur = Math.max(ENTER.minDur, L / ENTER.speed);
      end = Math.max(end, ENTER.startAt + dur);
      el.animate(                                  // 四字母同时起笔，各自按自身长度匀速写完
        [{strokeDashoffset: L}, {strokeDashoffset: 0}],
        {duration: dur * 1000, delay: ENTER.startAt * 1000, easing: 'linear', fill: 'forwards'}
      );
    });

    // 菜单项等画面开始渐显时再滑入（此刻还没到首帧，改延迟不会打断动画）
    const liftAt = end + ENTER.hold;
    document.getElementById('menu').style.animationDelay = (liftAt + ENTER.menuLag).toFixed(2) + 's';

    // 写完停一拍再散黑幕；标题此刻浮在黑幕之上，等黑幕散尽才落回原层级
    setTimeout(() => {
      fadeEl.style.transitionDuration = ENTER.fadeDur + 's';
      fadeEl.classList.remove('on');
      setTimeout(() => {
        fadeEl.style.transitionDuration = '';
        document.body.classList.remove('enter');
      }, ENTER.fadeDur * 1000 + 80);
    }, liftAt * 1000);
  })();

  // ---------- ui refs ----------
  const items = [...document.querySelectorAll('.item')];
  const fade = document.getElementById('fade');
  const fadeMsg = document.getElementById('fadeMsg');
  const fadeSub = document.getElementById('fadeSub');
  const fadeStats = document.getElementById('fadeStats');
  const statDeath = document.getElementById('statDeath');
  const statJump  = document.getElementById('statJump');
  const statTime  = document.getElementById('statTime');
  const overlay = document.getElementById('overlay');
  const panelSave = document.getElementById('pSave');
  const panelSet = document.getElementById('pSet');
  const panelAbout = document.getElementById('pAbout');
  const panelConfirm = document.getElementById('pConfirm');
  const panels = { save: panelSave, settings: panelSet, about: panelAbout, confirm: panelConfirm };
  const cDesc = panelConfirm.querySelector('.c-desc');
  const cBtns = [document.getElementById('btnCancel'), document.getElementById('btnOk')];

  const SAVE_KEY = 'echo.saves.v1';
  const SLOT_N = 4;
  const pad = n => String(n).padStart(2, '0');

  let idx = 0;            // 主菜单选中项
  let mode = 'title';     // title | save | settings | confirm | play | ending
  let saveMode = 'new';   // new(开始游戏) | load(继续游戏)
  let slotEls = [];
  let sel = 0;            // 存档槽选中项
  let cSel = 1;           // 确认框选中按钮
  let confirmFrom = 'title';
  let confirmOk = null;
  let confirmReturn = null;   // 确认后要就地回到的面板（如"删除存档"→回到选择存档页）
  let saves = readSaves();

  function readSaves(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      const arr = raw ? JSON.parse(raw) : null;
      if(Array.isArray(arr)) return arr;

  // ---------- overlay ----------

  let swapping = false, swapTimer = 0;
  const SWAP_MS = 430;                     // 与收合动画时长（.panel-wipe 的 .42s）对齐

  function showPanel(name){
    if(overlay.classList.contains('on') && mode !== name){
      overlay.classList.add('closing');    // 当前面板开始收合
      swapping = true;
      clearTimeout(swapTimer);
      swapTimer = setTimeout(() => { overlay.classList.remove('closing'); applyPanel(name); }, SWAP_MS);
      return;
    }
    applyPanel(name);
  }
  function applyPanel(name){
    clearTimeout(swapTimer);
    Object.keys(panels).forEach(k => panels[k].classList.toggle('show', k === name));
    overlay.classList.remove('on');
    void overlay.offsetWidth;              // 强制 reflow，保证出场动画完整播放
    overlay.classList.add('on');
    swapping = false;
    mode = name;
    if(document.activeElement && document.activeElement.blur) document.activeElement.blur();

  // 切换到某一关：把该关的宽度/地形/检查点/出生点/终点换到全局，并同步世界层的尺寸
  function applyLevel(n){

  function buildLevel(){
    rects = []; cpEls = []; gateEl = null;
    gTerrain.textContent = ''; gProps.textContent = ''; gPlayer.textContent = '';

    // 深渊：底部碎石带横贯全宽，在缺口处用深色渐变盖成黑洞，掉落判定才符合直觉
    for(let i = 0; i < SOLIDS.length - 1; i++){
      const gx0 = SOLIDS[i][0] + SOLIDS[i][2], gx1 = SOLIDS[i + 1][0];
      if(gx1 <= gx0) continue;
      gTerrain.appendChild(mk('rect', {x:gx0 - 6, y:700, width:gx1 - gx0 + 12, height:200, class:'abyss'}));
    }

    SOLIDS.forEach(([x, y, w, h, type]) => {
      const ground = type === 'g';
      gTerrain.appendChild(mk('rect', {x, y, width:w, height:ground ? WORLD_H - y : h, class:ground ? 'slab-g' : 'slab-f'}));
      gTerrain.appendChild(mk('line', {x1:x, y1:y + 1, x2:x + w, y2:y + 1, class:'edge'}));   // 受光的顶边
      if(!ground) gTerrain.appendChild(mk('line', {x1:x, y1:y + h - 1, x2:x + w, y2:y + h - 1, class:'edge-dim'}));
      rects.push({x0:x, y0:y, x1:x + w, y1:ground ? WORLD_H : y + h});
    });

    // A 点：只留一根立柱，不再有字母
    gProps.appendChild(mk('path', {d:'M' + (SPAWN.x + 15) + ' ' + (SPAWN.y + HERO_H) + ' V' + (SPAWN.y - 44), class:'cp-post', id:'spawnPost'}));

    // 检查点
    CPS.forEach(cp => {
      const g = mk('g', {class:'cp'});
      g.appendChild(mk('path', {d:'M' + cp.x + ' ' + cp.y + ' V' + (cp.y - 54), class:'cp-post'}));
      g.appendChild(mk('circle', {cx:cp.x, cy:cp.y - 64, r:11, class:'cp-ring'}));
      g.appendChild(mk('circle', {cx:cp.x, cy:cp.y - 64, r:3.4, class:'cp-dot'}));
      g.appendChild(mk('circle', {cx:cp.x, cy:cp.y - 64, r:11, class:'cp-flash'}));   // 激活时的一次性亮起
      // 激活后在圆环周围持续漂浮的发光粒子：位置/漂移/周期都随机，负延迟让它们一开始就错开相位
      const cpx = cp.x, cpy = cp.y - 64;
      for(let n = 0; n < 18; n++){
        const a = Math.random() * Math.PI * 2, rad = 8 + Math.random() * 24;
        const px = cpx + Math.cos(a) * rad, py = cpy + Math.sin(a) * rad * .78;
        const r = .9 + Math.random() * 1.5;
        const p = mk('g', {class:'cp-p', style:
          '--x:' + px.toFixed(1) + 'px;--y:' + py.toFixed(1) + 'px;' +
          '--dx:' + ((Math.random() - .5) * 22).toFixed(1) + 'px;' +
          '--dy:' + (-14 - Math.random() * 30).toFixed(1) + 'px;' +
          '--dur:' + (3.2 + Math.random() * 3.2).toFixed(2) + 's;' +
          '--del:' + (-Math.random() * 6.4).toFixed(2) + 's'});
        p.appendChild(mk('circle', {cx:0, cy:0, r:(r * 2.6).toFixed(2), opacity:'.16'}));
        p.appendChild(mk('circle', {cx:0, cy:0, r:r.toFixed(2)}));
        g.appendChild(p);
      }
      gProps.appendChild(g);
      cpEls.push(g);
    });

    // 终点：光柱信标（无文字）。缓转的虚线外环 + 四角对位刻度 + 核心亮点 + 柱内缓升光点
    const gg = mk('g', {class:'goal'});
    const gcx = GOAL.x + GOAL.w / 2, gcy = GOAL.y + 36;
    gg.appendChild(mk('rect', {x:GOAL.x + 10, y:gcy + 30, width:GOAL.w - 20,
      height:GOAL.y + GOAL.h - gcy - 30, class:'goal-beam'}));
    gg.appendChild(mk('circle', {cx:gcx, cy:gcy, r:54, class:'goal-halo'}));
    const spin = mk('g', {class:'goal-spin'});
    spin.appendChild(mk('circle', {cx:gcx, cy:gcy, r:46, class:'goal-dash'}));
    gg.appendChild(spin);
    for(let k = 0; k < 4; k++){                       // 四角对位刻度，呼应面板的四角括线
      const a = Math.PI / 4 + k * Math.PI / 2;
      gg.appendChild(mk('line', {
        x1:(gcx + Math.cos(a) * 37).toFixed(1), y1:(gcy + Math.sin(a) * 37).toFixed(1),
        x2:(gcx + Math.cos(a) * 54).toFixed(1), y2:(gcy + Math.sin(a) * 54).toFixed(1),
        class:'goal-tick'}));
    }
    gg.appendChild(mk('circle', {cx:gcx, cy:gcy, r:30, class:'goal-ring'}));
    gg.appendChild(mk('circle', {cx:gcx, cy:gcy, r:33, class:'goal-ring-in'}));
    gg.appendChild(mk('circle', {cx:gcx, cy:gcy, r:9, class:'goal-core'}));
    for(let n = 0; n < 16; n++){                      // 柱内缓升的光点，与记录点同一套语言
      const a = Math.random() * Math.PI * 2, rad = 5 + Math.random() * 30;
      const p = mk('g', {class:'goal-mote', style:
        '--x:' + (gcx + Math.cos(a) * rad).toFixed(1) + 'px;' +
        '--y:' + (gcy + Math.sin(a) * rad * .95).toFixed(1) + 'px;' +
        '--dx:' + ((Math.random() - .5) * 14).toFixed(1) + 'px;' +
        '--dy:' + (-26 - Math.random() * 48).toFixed(1) + 'px;' +
        '--dur:' + (3.4 + Math.random() * 3.4).toFixed(2) + 's;' +
        '--del:' + (-Math.random() * 6.8).toFixed(2) + 's'});
      const mr = .8 + Math.random() * 1.3;
      p.appendChild(mk('circle', {cx:0, cy:0, r:(mr * 2.4).toFixed(2), opacity:'.15'}));
      p.appendChild(mk('circle', {cx:0, cy:0, r:mr.toFixed(2)}));
      gg.appendChild(p);
    }
    gProps.appendChild(gg);
    goalEl = gg;

    // 祭坛：三级石台，铺在终点平台的顶面上（与检查点立柱同层、纯装饰，不参与碰撞）
    if(ALTAR){
      const ax = ALTAR.x, aw = ALTAR.w, base = ALTAR.y;
      const altar = mk('g', {class:'altar'});
      altar.appendChild(mk('rect', {x:ax, y:base - 14, width:aw, height:14, class:'slab-f'}));
      altar.appendChild(mk('rect', {x:ax + 25, y:base - 30, width:aw - 50, height:16, class:'slab-f'}));
      altar.appendChild(mk('rect', {x:ax + 50, y:base - 44, width:aw - 100, height:14, class:'slab-f'}));
      altar.appendChild(mk('line', {x1:ax, y1:base - 13, x2:ax + aw, y2:base - 13, class:'edge'}));
      altar.appendChild(mk('line', {x1:ax + 25, y1:base - 29, x2:ax + aw - 25, y2:base - 29, class:'edge-dim'}));
      altar.appendChild(mk('line', {x1:ax + 50, y1:base - 43, x2:ax + aw - 50, y2:base - 43, class:'edge-dim'}));
      gProps.appendChild(altar);
      // PRESS E 提示也挂在祭坛上方的世界坐标处
      altarHint.style.left = (ALTAR.x + ALTAR.w / 2).toFixed(1) + 'px';
      altarHint.style.bottom = (WORLD_H - (base - 44 - 30)).toFixed(1) + 'px';
    }

    // 终点大门：两根立柱 + 楣石 + 一扇可上移收进楣石的门板（习得二段跳后开启）
    if(GATE){
      const gx = GATE.x, gy = GATE.y, gw = GATE.w, gh = GATE.h;
      const gate = mk('g', {class:'gate'});
      gate.appendChild(mk('rect', {x:gx, y:gy, width:6, height:gh, class:'slab-f'}));
      gate.appendChild(mk('rect', {x:gx + gw - 6, y:gy, width:6, height:gh, class:'slab-f'}));
      gate.appendChild(mk('rect', {x:gx - 5, y:gy - 9, width:gw + 10, height:13, class:'slab-f'}));
      gate.appendChild(mk('path', {d:'M' + gx + ' ' + (gy + gh) + ' V' + gy, class:'edge'}));
      gate.appendChild(mk('path', {d:'M' + (gx + gw) + ' ' + (gy + gh) + ' V' + gy, class:'edge'}));
      gate.appendChild(mk('rect', {x:gx + 6, y:gy, width:gw - 12, height:gh, class:'gate-door'}));
      gProps.appendChild(gate);
      gateEl = gate;
    }

    // 玩家：白色小方块 + 黑眼睛（方块底边对齐碰撞盒底部，即"脚"所在处）
    heroEl = mk('g', {id:'hero', 'data-face':'right'});
    heroEl.appendChild(mk('rect', {x:0, y:22, width:30, height:30, rx:3, class:'hero-body'}));
    const eyeWrap = mk('g', {class:'eye-wrap'});
    eyeWrap.appendChild(mk('rect', {x:12, y:33, width:6, height:8, rx:3, class:'hero-eye'}));
    // 晕眩眼：两条交叉线。挣脱落地后替换掉普通眼睛
    const xEye = mk('g', {class:'x-eye'});
    xEye.appendChild(mk('line', {x1:10, y1:31.5, x2:20, y2:41.5, stroke:'#0b1219',
      'stroke-width':1.7, 'stroke-linecap':'round'}));
    xEye.appendChild(mk('line', {x1:20, y1:31.5, x2:10, y2:41.5, stroke:'#0b1219',
      'stroke-width':1.7, 'stroke-linecap':'round'}));
    eyeWrap.appendChild(xEye);
    heroEl.appendChild(eyeWrap);
    // "朝上"表情：两只贴在方块上部的眼睛（习得二段跳的过场里用）
    const upEye = mk('g', {class:'up-eye'});
    upEye.appendChild(mk('rect', {x:8,  y:27, width:5, height:7, rx:2.5, class:'hero-eye'}));
    upEye.appendChild(mk('rect', {x:17, y:27, width:5, height:7, rx:2.5, class:'hero-eye'}));
    heroEl.appendChild(upEye);
    gPlayer.appendChild(heroEl);

    // 过场石块层：挂在 player 之后，飞散时能盖住玩家下半身
    gRubble.textContent = '';
    stoneEl = mk('g', {id:'stones'});
    gRubble.appendChild(stoneEl);
    stones = []; stoneState = 'idle'; stoneT = 0;
    introBounce = 0;
    heroEl.classList.remove('dizzy');
    gPlayer.removeAttribute('clip-path');
  }

  function overlaps(s){
    return hero.x + HERO_W > s.x0 && hero.x < s.x1 && hero.y + HERO_H > s.y0 && hero.y < s.y1;
  }
  function moveX(dx){
    if(!dx) return;
    hero.x += dx;
    for(const s of rects){
      if(!overlaps(s)) continue;
      hero.x = dx > 0 ? s.x0 - HERO_W - EPS : s.x1 + EPS;
      hero.vx = 0;
    }
  }
  function moveY(dy){
    if(!dy) return;
    hero.y += dy;
    hero.onGround = false;
    for(const s of rects){
      if(!overlaps(s)) continue;
      if(dy > 0){ hero.y = s.y0 - HERO_H - EPS; hero.vy = 0; hero.onGround = true; }
      else { hero.y = s.y1 + EPS; hero.vy = 0; }
    }
  }

  // ---------- 石块：挣脱时爆开、受重力落地，纯装饰、不与玩家碰撞，很快淡出 ----------
  function placeStone(b){
    b.el.setAttribute('transform', 'translate(' + b.x.toFixed(2) + ' ' + b.y.toFixed(2) + ')');
  }

  // 生成一块石头。轴对齐不旋转，碰撞框与画面一致
  function makeStone(x, y, w, h){
    const g = mk('g', {class:'stone'});
    // 与地图场景同色同边框：直接复用地形那几个类，避免两处各写一套颜色后走样
    g.appendChild(mk('rect', {width:w, height:h, class:'slab-g'}));
    g.appendChild(mk('line', {x1:0, y1:1, x2:w, y2:1, class:'edge'}));
    stoneEl.appendChild(g);
    const b = {x, y, w, h, vx:0, vy:0, el:g, rest:false};
    placeStone(b);
    stones.push(b);
    return b;
  }

  // 卡住期间每按一次冒出的碎块：小而碎，从土里被挤到主角周围
  function emitSmall(){
    for(let i = 0; i < 3; i++){
      const dir = Math.random() < .5 ? -1 : 1;
      const b = makeStone(hero.x + HERO_W / 2 + dir * (12 + Math.random() * 26),
        SOLIDS[0][1] - 20 - Math.random() * 14,
        5 + Math.random() * 8, 4 + Math.random() * 7);
      b.vx = dir * (60 + Math.random() * 130);
      b.vy = -150 - Math.random() * 170;
    }
    stoneState = 'live';
  }

  // 挣脱瞬间：从地里爆出一大批石块
  function emitBig(){
    for(let i = 0; i < 30; i++){
      const sp = 320 + Math.random() * 420;
      const b = makeStone(hero.x + HERO_W / 2 + (Math.random() - .5) * 40,
        SOLIDS[0][1] - 6 - Math.random() * 16,
        7 + Math.random() * 15, 5 + Math.random() * 13);
      b.vx = (Math.random() * 2 - 1) * sp * .55;
      b.vy = -sp * (.7 + Math.random() * .5);
    }
    stoneState = 'live';
  }

  function stepStones(dt){
    if(!stones.length || stoneState === 'idle' || stoneState === 'gone') return;
    if(stoneState === 'live'){
      let moving = false;
      for(const b of stones){
        if(b.rest) continue;
        b.ground = false;
        b.vy = Math.min(STONE.maxVy, b.vy + STONE.grav * dt);
        b.x += b.vx * dt; b.y += b.vy * dt;
        for(const s of rects){                                  // 与地形碰撞：落到台面上
          if(b.x + b.w <= s.x0 || b.x >= s.x1) continue;
          if(b.vy > 0 && b.y + b.h > s.y0 && b.y + b.h - b.vy * dt <= s.y0 + 2){
            b.y = s.y0 - b.h; b.vy = 0; b.vx *= .45; b.ground = true;
          }
        }
        if(b.y + b.h > WORLD_H){                                // 掉到世界底部：垫在底边上
          b.y = WORLD_H - b.h; b.vy = 0; b.vx *= .5; b.ground = true;
        }
        if(b.ground && Math.abs(b.vx) < STONE.sleepVx){
          b.rest = true; b.vx = 0; b.vy = 0;
        } else moving = true;
        placeStone(b);
      }
      if(!moving){ resolveStones(); stoneState = 'settle'; stoneT = 0; }
    } else if(stoneState === 'settle'){
      stoneT += dt;
      if(stoneT >= INTRO.stoneHold){ stoneState = 'fade'; stoneT = 0; stoneEl.classList.add('stones-fade'); }
    } else if(stoneState === 'fade'){
      stoneT += dt;
      if(stoneT >= INTRO.stoneFade){
        stoneEl.classList.remove('stones-fade');
        stoneEl.textContent = '';
        stones = []; stoneState = 'gone';
      }
    }
  }

  // 静置后把互相重叠的石块横向推开，避免看起来插在一起
  function resolveStones(){
    for(let pass = 0; pass < 3; pass++){
      for(let i = 0; i < stones.length; i++){
        const a = stones[i];
        if(!a.rest) continue;
        for(let j = i + 1; j < stones.length; j++){
          const b = stones[j];
          if(!b.rest) continue;
          const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
          if(ox <= 0) continue;
          const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
          if(oy <= 0) continue;
          const push = ox / 2 + .1;
          if(a.x + a.w / 2 <= b.x + b.w / 2){ a.x -= push; b.x += push; }
          else { a.x += push; b.x -= push; }
        }
      }
      for(const b of stones){
        b.x = clamp(b.x, 0, WORLD_W - b.w);
        placeStone(b);
      }
    }
  }

  // ---------- 开场过场：坠落 → 卡进地里 → 挣脱 → 爆开石块 → 弹跳 → 交还操作 ----------
  // 坠落：只受重力，横向锁死在落点上方；翻转角度用"下落进度"驱动，落地时正好转满整圈
  function stepFall(dt){
    hero.vy = Math.min(PHYS.maxVy * 1.7, hero.vy + PHYS.grav * INTRO.gust * dt);
    hero.y += hero.vy * dt;
    const p = clamp((hero.y - INTRO.fallY) / (INTRO.landY - INTRO.fallY), 0, 1);
    hero.spin = INTRO.turns * 360 * p;
    if(hero.y >= INTRO.landY) landInPile();
  }

  // 落地：卡进地里。给玩家加裁切，只显示地表面以上的部分，随抬升逐段露出
  function landInPile(){
    hero.y = INTRO.landY; hero.vy = 0; hero.spin = 0;
    introPhase = 'stuck';
    stage.classList.add('intro-stuck');        // 提示的杆子在落地这一刻才浮现
    stuckHits = 0; stuckLift = 0;
    gPlayer.setAttribute('clip-path', 'url(#groundClip)');
    // 提示停在出生点标杆（世界里的既有竖线）顶端上方，避开杆身、不与线交叠
    introLead.style.left = (SPAWN.x + 15).toFixed(1) + 'px';
    introLead.style.bottom = (WORLD_H - (SPAWN.y - 44 - 5)).toFixed(1) + 'px';
    introLead.classList.add('show');
  }

  // 卡住：位置锁死（不受重力），每次按空格抬升一点，抬升用缓动走完
  function stepStuck(dt){
    hero.spin = 0; hero.vy = 0;
    hero.shake = Math.max(0, hero.shake - dt);
    const ty = INTRO.landY - stuckLift;
    hero.y += (ty - hero.y) * Math.min(1, dt * 15);
    stepStones(dt);                     // 按空格挤出的碎块继续落回地面
  }

  // 按一次空格：身体震动一下、被抬高一截、挤出一小堆碎块；够次数就完全脱出
  function stuckPress(){
    if(introPhase !== 'stuck') return;
    stuckHits++;
    stuckLift = stuckHits * INTRO.lift;
    hero.shake = INTRO.shakeT;
    emitSmall();
    if(stuckHits >= INTRO.need) burstOut();
  }

  // 完全脱出：爆出一大批石块、眼睛变 X、整屏震动，然后进入落地弹跳
  function burstOut(){
    introPhase = 'bounce';
    stage.classList.remove('intro-stuck');     // 挣脱了，杆子连同提示一起消失
    introBounce = 0;
    hero.spin = 0; hero.shake = 0; hero.vx = 0;
    hero.vy = INTRO.burstV;
    hero.onGround = false; hero.coyote = 0; hero.buffer = 0;
    cutLock = 999;                         // 弹跳期间锁住"松键截断"，保证这一冲是完整的
    gPlayer.removeAttribute('clip-path');  // 完全出来了，不再需要裁切
    heroEl.classList.add('dizzy');         // 晕眩：眼睛变成 X
    introLead.classList.remove('show');
    emitBig();                             // 从地里爆出一大批可推动的石块
    stage.classList.remove('quake');
    void stage.offsetWidth;                // 强制 reflow，让震动动画能重新播放
    stage.classList.add('quake');
    setTimeout(() => stage.classList.remove('quake'), 700);
  }

  // 落地弹跳：重力减半、每次触地保留部分速度，弹几下后交还操作
  function stepBounce(dt){
    const restY = INTRO.landY - INTRO.need * INTRO.lift;   // 地面上表面 = 完全脱出后的高度
    hero.vx = 0;
    hero.vy = Math.min(PHYS.maxVy, hero.vy + PHYS.grav * INTRO.bounceG * dt);
    hero.y += hero.vy * dt;
    hero.shake = Math.max(0, hero.shake - dt);
    if(hero.y >= restY){
      hero.y = restY;
      introBounce++;
      if(introBounce >= INTRO.bounceN){ endIntro(restY); return; }
      hero.vy = hero.vy < -60 ? hero.vy * INTRO.bounceE : -150;
      hero.shake = .14;                    // 每次触地弹一下
    }
    stepStones(dt);
  }

  // 取"屏幕正中"落在背景（世界坐标）里的那个点：用当前镜头变换反解，随视口/缩放自适应
  function screenCenterWorld(){
    const cs = getComputedStyle(stage);
    const z = parseFloat(cs.getPropertyValue('--zoom')) || 1;
    const tx = parseFloat(cs.getPropertyValue('--camtx')) || 0;
    const ty = parseFloat(cs.getPropertyValue('--camty')) || 0;
    const s = sc();
    return {x:(window.innerWidth * .5 / z - tx) / s, y:(window.innerHeight * .5 / z - ty) / s};
  }

  // 打出章节标题：锚在"背景正中"对应的世界坐标上，停留片刻后自行淡出
  function showChapter(){
    const a = screenCenterWorld();
    chapterTag.style.left = a.x.toFixed(1) + 'px';
    chapterTag.style.bottom = (WORLD_H - a.y - chapterTag.offsetHeight / 2).toFixed(1) + 'px';
    chapterTag.classList.add('show');
    clearTimeout(chapterTimer);
    chapterTimer = setTimeout(() => chapterTag.classList.remove('show'), INTRO.tagHold * 1000);
  }

  // 交还操作：眼睛恢复、镜头收回、计时从这一刻开始
  function endIntro(restY){
    introPhase = 'free';
    // 章节标题不立刻打：等镜头完全还原（zoomT 归零）后，在背景正中显示
    chapterWait = true;
    cutLock = 0;
    hero.y = restY; hero.vy = 0; hero.onGround = true;
    hero.shake = 0;
    heroEl.classList.remove('dizzy');
    lastT = performance.now();             // 丢弃过场期间累积的时间差，避免交还瞬间跳一大步
  }

  // ---------- 习得二段跳：推近 → 主角缓慢上升（眼睛朝上）→ 白光炸开 → 镜头回正 → 居中字幕 + 冷却条 → 大门开启 ----------
  function atAltar(){
    return !!ALTAR && hero.onGround &&
           hero.x + HERO_W > ALTAR.x && hero.x < ALTAR.x + ALTAR.w;
  }

  function startLearn(){
    if(learn || hasDouble) return;
    learn = { t:0, phase:'rise', fromY:hero.y, barShown:false };
    hero.vx = 0; hero.vy = 0; hero.spin = 0; hero.onGround = false;
    cutCamY = hero.y + HERO_H / 2;      // 冻结镜头焦点，主角才会在画面里真的升上去
    altarHint.classList.remove('show');
  }

  function stepLearn(dt){
    learn.t += dt;
    if(learn.phase === 'rise'){                 // 镜头推近 + 主角缓慢上升
      const p = Math.min(1, learn.t / LEARN.rise);
      hero.y = learn.fromY - LEARN.riseH * p * p * (3 - 2 * p);
      hero.spin = 0;
      if(p < .3) hero.face = 'up';              // 上升一开始就换上"眼睛朝上"的表情
      if(learn.t >= LEARN.rise){
        learn.t = 0; learn.phase = 'flash';
        hasDouble = true;                       // 这一刻起已习得
        whiteout.classList.add('on');           // 白光炸开
      }
    }else if(learn.phase === 'flash'){          // 满屏白光
      if(learn.t >= LEARN.flash){ learn.t = 0; learn.phase = 'out'; }
    }else if(learn.phase === 'out'){            // 镜头回正、白光消退
      if(learn.t >= LEARN.out){
        learn.t = 0; learn.phase = 'text';
        hero.y = learn.fromY; hero.vy = 0; hero.onGround = true;
        hero.face = 'right'; hero.djAvail = true; hero.djCd = 0;
        whiteout.classList.remove('on');
        learnTag.classList.add('show');
        document.body.classList.add('dj');
      }
    }else if(learn.phase === 'text'){           // 屏幕正中字幕，随后左下角冒出冷却条
      if(!learn.barShown && learn.t >= LEARN.textWait){
        learn.barShown = true;
        djBar.classList.add('show');
      }
      if(learn.t >= LEARN.text){
        learn.t = 0; learn.phase = 'gate';
        learnTag.classList.remove('show');
        if(gateEl) gateEl.classList.add('open');   // 终点大门打开
      }
    }else if(learn.phase === 'gate'){           // 大门开后交还操作，走进门里即可进入下一关
      if(learn.t >= LEARN.gate){ learn = null; cutCamY = null; hero.onGround = true; }
    }
  }

  // 走进开启的大门：黑幕里换到下一关
  function nextLevel(){
    if(learn || levelIdx >= LEVELS.length - 1) return;
    mode = 'loading';                          // 换关期间不吃输入
    stopLoop();
    flushPlayed();
    fade.classList.remove('quick');
    fadeMsg.textContent = LEVELS[levelIdx + 1].name;
    fadeSub.textContent = '载入中';
    fade.classList.add('on');
    setTimeout(() => loadLevel(levelIdx + 1, false), 520);
  }

  function step(dt){
    if(cutLock > 0) cutLock = Math.max(0, cutLock - dt);
    // 过场镜头：坠落、卡住、弹跳、习得二段跳的上升阶段都推近到主角身上，交还操作后平滑收回
    const zoomIn = (introPhase === 'fall' || introPhase === 'stuck' || introPhase === 'bounce') ||
                   (learn && (learn.phase === 'rise' || learn.phase === 'flash'));
    const zt = zoomIn ? 1 : 0;
    if(zoomT !== zt) zoomT = zt > zoomT ? Math.min(zt, zoomT + dt * 2.0)
                                        : Math.max(zt, zoomT - dt * 1.6);
    // 镜头完全还原之后，才在背景正中打出章节标题
    if(chapterWait && zoomT <= .001){ chapterWait = false; showChapter(); }
    if(introPhase === 'wait') return;                       // 幕布还没拉开，玩家在画外
    if(introPhase === 'fall'){ stepFall(dt); return; }
    if(introPhase === 'stuck'){ stepStuck(dt); return; }
    if(introPhase === 'bounce'){ stepBounce(dt); return; }
    if(learn){ stepLearn(dt); return; }                     // 习得二段跳的过场期间不接受操作

    if(dead){                       // 掉进虚空：粒子继续演算，等玩家按 R 重塑
      stepFx(dt);
      stepStones(dt);
      return;
    }

    const dir = ((keys['arrowright'] || keys['d']) ? 1 : 0) - ((keys['arrowleft'] || keys['a']) ? 1 : 0);
    if(dir) hero.face = dir > 0 ? 'right' : 'left';   // 眼睛朝向跟随移动方向，停下时保持上一次朝向
    const target = dir * PHYS.maxVx;
    const acc = hero.onGround ? (dir ? PHYS.accG : PHYS.decG) : (dir ? PHYS.accA : PHYS.decA);
    if(hero.vx < target)      hero.vx = Math.min(target, hero.vx + acc * dt);
    else if(hero.vx > target) hero.vx = Math.max(target, hero.vx - acc * dt);

    // 土狼时间与跳跃缓冲：让"明明按了却没反应"的情况消失
    hero.djCd = Math.max(0, hero.djCd - dt);
    if(hero.onGround) hero.djAvail = true;                // 落地即补充空中那一跳
    hero.coyote = hero.onGround ? PHYS.coyote : Math.max(0, hero.coyote - dt);
    hero.buffer = Math.max(0, hero.buffer - dt);
    if(hero.buffer > 0 && hero.coyote > 0){
      hero.vy = PHYS.jumpV;
      hero.onGround = false;
      hero.coyote = 0;
      hero.buffer = 0;
      hero.djAvail = true;                               // 离地后二段跳可用
    }else if(hero.buffer > 0 && hasDouble && hero.djAvail && !hero.onGround && hero.djCd <= 0){
      hero.vy = PHYS.jumpV;                              // 二段跳：空中再给一次初速
      hero.buffer = 0;
      hero.djAvail = false;
      hero.djCd = DJ.cd;
    }
    hero.vy = Math.min(PHYS.maxVy, hero.vy + PHYS.grav * dt);

    moveX(hero.vx * dt);
    moveY(hero.vy * dt);

    // 检查点：只向前推进，回走不会退回更早的检查点
    for(let i = lastCP + 1; i < CPS.length; i++){
      const cp = CPS[i];
      if(hero.x + HERO_W > cp.x - 44 && hero.x < cp.x + 44 &&
         hero.y + HERO_H > cp.y - 116 && hero.y < cp.y + 4){
        lastCP = i;
        cpEls[i].classList.add('on', 'lit');
        break;
      }
    }

    if(ALTAR){
      // 第一关：终点是祭坛。站上去且尚未习得时给出 PRESS E；习得后走进大门换关
      if(!hasDouble){
        const on = atAltar();
        altarHint.classList.toggle('show', on);
        goalEl.classList.toggle('on', on);
      }
      if(GATE && hasDouble && hero.x + HERO_W > GATE.x){ nextLevel(); return; }
    }else if(hero.x + HERO_W > GOAL.x && hero.x < GOAL.x + GOAL.w &&
             hero.y + HERO_H > GOAL.y && hero.y < GOAL.y + GOAL.h){ finishLevel(); return; }

    // 掉进深渊
    if(hero.y > WORLD_H + 80) voidDeath();

    // 计时：played 按 dt 累加，每 5 秒落一次盘，避免每帧写 localStorage
    elapsed += dt;
    playedAcc += dt;
    sinceSave += dt;
    if(sinceSave >= 5){ sinceSave = 0; flushPlayed(); }

    stepStones(dt);
    stepFx(dt);
  }

  // 把过场推近写回恒等变换（zoom=1、位移=0）
  function resetZoomVars(){
    zoomT = 0; zoomWritten = false;
    stage.style.setProperty('--zoom', '1');
    stage.style.setProperty('--camtx', '0px');
    stage.style.setProperty('--camty', '0px');
  }

  // 镜头：死区跟随 + 平滑，钳制到世界边界
  function updateCam(dt){
    const vw = viewW(), px = hero.x + HERO_W / 2, half = vw / 2, dead = vw * 0.32;
    let want = camX;
    if(px - camX < half - dead / 2)      want = px - half + dead / 2;
    else if(px - camX > half + dead / 2) want = px - half - dead / 2;
    camX = clampCam(camX + (clampCam(want) - camX) * Math.min(1, dt * 8));
  }

  function render(){
    let hx = hero.x, hy = hero.y;
    if(hero.shake > 0){                     // 卡住时按下空格的震动：绕自身中心抖一下再衰减
      const p = hero.shake / INTRO.shakeT;
      hx += Math.sin(hero.shake * 150) * 4 * p;
      hy += Math.cos(hero.shake * 190) * 2.2 * p;
    }
    heroEl.setAttribute('transform', 'translate(' + hx.toFixed(2) + ' ' + hy.toFixed(2) +
      ') rotate(' + hero.spin.toFixed(2) + ' 15 37)');   // 绕可见方块中心旋转
    if(faceSet !== hero.face){ faceSet = hero.face; heroEl.setAttribute('data-face', hero.face); }
    stage.style.setProperty('--camx', camX.toFixed(2));
    // 过场推近：以主角为中心缩放。zoomT=0 时写回恒等变换，完全不影响正常镜头
    const e = zoomT * zoomT * (3 - 2 * zoomT);
    if(e > .0005){
      const s0 = sc(), Z = 1 + (INTRO.zoomMax - 1) * e;
      const ix = (hero.x + HERO_W / 2 - camX) * s0;
      // 习得二段跳的上升阶段：镜头焦点高度冻结在起手位置，
      // 这样画面里看到的是主角自己在往上升，而不是整个世界在往下滑。
      const iy = (cutCamY != null ? cutCamY : hero.y + HERO_H / 2) * s0;
      // 夹住运镜范围：缩放后可见的世界区域必须完整落在世界边界内。
      // 否则画面会露出地图之外（左边 x<0 / 下方 y>900）的空白背景。
      const IW = window.innerWidth, IH = window.innerHeight;
      const txMin = IW / Z - (WORLD_W - camX) * s0;   // 右边界不许越过世界右端
      const txMax = camX * s0;                        // 左边界不许越过世界左端
      const tyMin = IH / Z - WORLD_H * s0;            // 下边界不许越过世界底端
      const tx = clamp(IW * .5 / Z - ix, Math.min(txMin, txMax), Math.max(txMin, txMax));
      const ty = clamp(IH * .6 / Z - iy, Math.min(tyMin, 0), Math.max(tyMin, 0));
      stage.style.setProperty('--zoom', Z.toFixed(5));
      stage.style.setProperty('--camtx', (tx * e).toFixed(2) + 'px');
      stage.style.setProperty('--camty', (ty * e).toFixed(2) + 'px');
      zoomWritten = true;
    } else if(zoomWritten){
      resetZoomVars();
    }
    const info = '存档 ' + pad(curSlot + 1) + ' · ' + clock(Math.floor(elapsed)) +
                 ' · 检查点 ' + Math.max(0, lastCP + 1) + '/' + CPS.length;
    if(info !== hudCache){ hudCache = info; hudInfo.textContent = info; }
    // 二段跳冷却条：条满=可用，用掉后随 CD 回填
    if(hasDouble){
      const p = Math.round(Math.max(0, Math.min(1, 1 - hero.djCd / DJ.cd)) * 1000) / 10;
      const w = p.toFixed(1) + '%';
      if(djFill.style.width !== w) djFill.style.width = w;
    }
  }

  function tick(t){
    if(!running) return;
    if(!lastT) lastT = t;
    const dt = Math.min((t - lastT) / 1000, .033);   // 钳制 dt，防止切标签页回来时一帧穿墙
    lastT = t;
    step(dt);
    updateCam(dt);
    render();
    if(!running) return;                             // step 里可能已经结束了关卡
    rafId = requestAnimationFrame(tick);
  }
  function startLoop(){ running = true; lastT = 0; rafId = requestAnimationFrame(tick); }
  function stopLoop(){ running = false; if(rafId) cancelAnimationFrame(rafId); rafId = 0; lastT = 0; }

  // 掉进虚空：在深渊口炸开粒子并弹出重塑提示，之后等玩家按 R
  function voidDeath(){
    if(dead) return;
    dead = true;
    hero.vx = 0; hero.vy = 0;
    burstFx(hero.x + HERO_W / 2, WORLD_H - 34);   // 主角已在画面外，效果落在它消失的那条水平线上
    voidHint.classList.add('show');
  }

  // 粒子爆炸：一圈向外飞散的白点 + 一道外扩冲击环。
  // 用 JS 逐帧推进（短命效果，且需要重力/阻尼），结束后整层清空
  function burstFx(x, y){
    gFx.textContent = '';
    fxP = []; fxT = 0; fxRing = null;
    fxRing = {el:mk('circle', {cx:x, cy:y, r:10, class:'fx-ring'}), x, y, t:0};
    gFx.appendChild(fxRing.el);
    const N = 34;
    for(let i = 0; i < N; i++){
      const a = (i / N) * Math.PI * 2 + Math.random() * .6;
      const sp = 70 + Math.random() * 210;
      const r = 1.1 + Math.random() * 2.2;
      const g = mk('g', {class:'fx-p'});
      g.appendChild(mk('circle', {cx:0, cy:0, r:(r * 2.6).toFixed(2), opacity:'.16'}));
      g.appendChild(mk('circle', {cx:0, cy:0, r:r.toFixed(2)}));
      gFx.appendChild(g);
      const life = .5 + Math.random() * .5;
      fxP.push({g, x, y, vx:Math.cos(a) * sp, vy:Math.sin(a) * sp * .8 - 30, life, maxLife:life});
    }
  }

  function stepFx(dt){
    if(!gFx.childNodes.length) return;
    fxT += dt;
    for(const p of fxP){
      if(p.life <= 0) continue;
      p.life -= dt;
      p.vy += 520 * dt;
      const drag = 1 - Math.min(1, 2.2 * dt);      // 空气阻尼，让爆炸收束成球形而不是一直外扩
      p.vx *= drag;
      p.x += p.vx * dt; p.y += p.vy * dt;
      const o = Math.max(0, p.life / p.maxLife);
      p.g.setAttribute('transform', 'translate(' + p.x.toFixed(1) + ' ' + p.y.toFixed(1) + ')');
      p.g.setAttribute('opacity', (o * o).toFixed(3));
    }
    if(fxRing){
      fxRing.t += dt;
      const k = Math.min(1, fxRing.t / .55);
      fxRing.el.setAttribute('r', (10 + 96 * k).toFixed(1));
      fxRing.el.setAttribute('opacity', Math.max(0, .7 * (1 - k)).toFixed(3));
    }
    if(fxT > 1.25){ gFx.textContent = ''; fxP = []; fxRing = null; fxT = 0; }
  }

  function respawn(){
    dead = false;
    voidHint.classList.remove('show');
    gFx.textContent = '';
    fxP = []; fxRing = null; fxT = 0;
    const p = lastCP >= 0 ? {x:CPS[lastCP].x - 15, y:CPS[lastCP].y - HERO_H - 1} : SPAWN;
    hero.x = p.x; hero.y = p.y;
    hero.vx = 0; hero.vy = 0; hero.onGround = false; hero.coyote = 0; hero.buffer = 0;
    hero.djAvail = false; hero.djCd = 0;
    camX = clampCam(hero.x - viewW() * 0.32);
    lastT = 0;
    render();
    fade.classList.add('quick', 'on');
    setTimeout(() => {
      if(inLevel && mode === 'play') fade.classList.remove('on');
      setTimeout(() => fade.classList.remove('quick'), 220);
    }, 130);
  }

  function flushPlayed(){
    if(curSlot < 0 || playedAcc <= 0) return;
    const sv = saves[curSlot];
    if(!sv){ playedAcc = 0; return; }
    sv.played = Math.round(playedBase + playedAcc);
    playedBase = sv.played;
    playedAcc = 0;
    writeSaves();
  }

  function enterLevel(i, withIntro){
    curSlot = i;
    const sv = saves[i];
    playedBase = sv ? (sv.played || 0) : 0;
    playedAcc = 0;
    loadLevel(0, withIntro);           // 每次从头开始都回到第一关
  }

  // 装载第 n 关：换地形、复位过场与习得状态、拉开幕布
  function loadLevel(n, withIntro){
    applyLevel(n);
    sinceSave = 0;
    elapsed = 0; lastCP = -1;

    buildLevel();
    cpEls.forEach(g => g.classList.remove('on', 'lit'));
    if(goalEl) goalEl.classList.remove('on');

    // 虚空死亡状态复位
    dead = false;
    voidHint.classList.remove('show');
    gFx.textContent = '';
    fxP = []; fxRing = null; fxT = 0;

    // 过场复位：重开新游戏时会重新演一遍坠落，提示也收起来
    introPhase = withIntro ? 'wait' : 'free';
    stage.classList.remove('intro-stuck');
    clearTimeout(chapterTimer); chapterWait = false; chapterTag.classList.remove('show');
    stuckHits = 0; stuckLift = 0; cutLock = 0;
    introLead.classList.remove('show');
    resetZoomVars();
    hero.spin = 0; hero.shake = 0; hero.face = 'right'; faceSet = '';

    // 习得二段跳的过场状态复位；只有从第一关开头进来才清掉"已习得"
    learn = null;
    cutCamY = null;
    whiteout.classList.remove('on');
    learnTag.classList.remove('show');
    altarHint.classList.remove('show');
    hero.djAvail = false; hero.djCd = 0;
    if(n === 0){
      hasDouble = false;
      document.body.classList.remove('dj');
      djBar.classList.remove('show');
      if(gateEl) gateEl.classList.remove('open');
    }

    if(withIntro){ hero.x = SPAWN.x; hero.y = INTRO.fallY; hero.vy = INTRO.fallV; }
    else         { hero.x = SPAWN.x; hero.y = SPAWN.y;    hero.vy = 0; }
    hero.vx = 0; hero.onGround = false; hero.coyote = 0; hero.buffer = 0;

    stage.style.setProperty('--s', sc().toFixed(5));
    camX = clampCam(hero.x - viewW() * 0.32);
    hudCache = '';
    render();

    document.body.classList.add('playing');
    mode = 'play';
    inLevel = true;
    startLoop();

    // 黑幕拉开后再清掉载入文案，避免复活黑闪时又浮现文字
    setTimeout(() => {
      if(inLevel && mode === 'play'){
        fade.classList.remove('on');
        fadeMsg.textContent = '';
        fadeSub.textContent = '';
        if(introPhase === 'wait') introPhase = 'fall';   // 幕布拉开后才起坠，别让黑幕挡住坠落
      }
    }, 620);
  }

  function leaveLevel(){
    if(!inLevel) return;              // 幂等：连续 ESC 不会重复收尾
    inLevel = false;
    stopLoop();
    flushPlayed();
    document.body.classList.remove('playing');
    fade.classList.remove('quick');
    stage.classList.remove('quake');
    introLead.classList.remove('show');
    introPhase = 'free';                     // 过场中途回标题也不会把提示/震动带到标题界面
    stage.classList.remove('intro-stuck');
    clearTimeout(chapterTimer); chapterWait = false; chapterTag.classList.remove('show');
    resetZoomVars();                          // 推近一并还原，否则标题界面会停在放大状态
    dead = false;                             // 虚空死亡状态一并清掉
    voidHint.classList.remove('show');
    gFx.textContent = '';
    fxP = []; fxRing = null; fxT = 0;
    // 习得二段跳的状态一并清掉，回到标题就像没进过关
    learn = null; hasDouble = false; cutCamY = null;
    whiteout.classList.remove('on');
    learnTag.classList.remove('show');
    altarHint.classList.remove('show');
    document.body.classList.remove('dj');
    djBar.classList.remove('show');
    if(gateEl) gateEl.classList.remove('open');
    hero.djAvail = false; hero.djCd = 0;
    stage.style.setProperty('--camx', '0');   // 镜头归零，标题背景回到原构图
    elapsed = 0; lastCP = -1; sinceSave = 0; curSlot = -1;
    cpEls.forEach(g => g.classList.remove('on', 'lit'));
    if(goalEl) goalEl.classList.remove('on');
    for(const k in keys) delete keys[k];   // 清空按键，避免带着方向键回到标题
  }

  function finishLevel(){
    if(mode !== 'play') return;
    mode = 'clear';
    goalEl.classList.add('on');
    stopLoop();
    flushPlayed();
    fade.classList.remove('quick');
    fadeMsg.textContent = '章节完成';
    fadeSub.textContent = '用时 ' + clock(Math.floor(elapsed)) + ' · ESC 返回标题';
    fade.classList.add('on');
  }

  // 初始就把世界缩放同步到视口，保证未进入关卡时背景也完整覆盖
  stage.style.setProperty('--s', sc().toFixed(5));

  // ---------- wiring ----------
  document.getElementById('btnSaveBack').addEventListener('click', backToMenu);
  document.getElementById('btnSetBack').addEventListener('click', backToMenu);
  document.getElementById('btnAboutBack').addEventListener('click', backToMenu);
  cBtns[0].addEventListener('mouseenter', () => { cSel = 0; syncCBtns(); });
  cBtns[1].addEventListener('mouseenter', () => { cSel = 1; syncCBtns(); });
  cBtns[0].addEventListener('click', confirmCancel);
  cBtns[1].addEventListener('click', confirmOkRun);
  document.getElementById('veil').addEventListener('click', () => {
    if(mode === 'save' || mode === 'settings' || mode === 'about') backToMenu();
    else if(mode === 'confirm') confirmCancel();
  });

  // ---------- keyboard ----------
  window.addEventListener('keydown', e => {
    const k = e.key;
    if(swapping) return;                 // 面板切换动画期间忽略输入，避免抢跳或误触
    if(document.body.classList.contains('enter')) return;   // 开场标题还在写、黑幕没散，先不吃输入

    if(mode === 'title'){
      if(k === 'ArrowDown' || k === 's' || k === 'S') setActive(idx + 1);
      else if(k === 'ArrowUp' || k === 'w' || k === 'W') setActive(idx - 1);
      else if(k === 'Enter' || k === ' '){ e.preventDefault(); select(items[idx]); }
      return;
    }
    if(mode === 'play' || mode === 'clear' || mode === 'ending'){
      if(k === 'Escape'){ e.preventDefault(); backToTitle(); return; }
      if(mode !== 'play') return;                    // clear / ending 只接受 ESC
      if(introPhase === 'wait' || introPhase === 'fall'){ e.preventDefault(); return; }  // 坠落中不接受操作
      if(introPhase === 'stuck'){                    // 卡住中：只统计空格
        if(k === ' ' || k === 'Spacebar'){ e.preventDefault(); if(!e.repeat) stuckPress(); }
        return;
      }
      if(learn) return;                              // 习得二段跳的过场期间不接受操作
      if(k === 'e' || k === 'E'){                    // 祭坛：按 E 习得二段跳
        if(!hasDouble && atAltar()){ e.preventDefault(); startLearn(); }
        return;
      }
      if(k === 'ArrowLeft' || k === 'ArrowRight' || k === 'ArrowUp' || k === ' ' || k === 'Spacebar') e.preventDefault();
      keys[k.toLowerCase()] = true;
      if(k === 'ArrowUp' || k === 'w' || k === 'W' || k === ' '){
        if(!e.repeat) hero.buffer = PHYS.buffer;     // 按下即置跳跃缓冲，落地前按也算数
      }else if(k === 'r' || k === 'R') respawn();
      return;
    }
    if(mode === 'settings' || mode === 'about'){
      if(k === 'Escape' || k === 'Enter' || k === 'Backspace'){ e.preventDefault(); backToMenu(); }
      return;
    }
    if(mode === 'save'){
      if(k === 'Escape' || k === 'Backspace'){ e.preventDefault(); backToMenu(); }
      else if(k === 'Delete'){ e.preventDefault(); askDeleteSave(sel); }
      else if(k === 'ArrowDown'){ e.preventDefault(); moveSel(1); }
      else if(k === 'ArrowUp'){ e.preventDefault(); moveSel(-1); }
      else if(k === 'Enter'){ e.preventDefault(); pickSlot(sel); }
      return;
    }
    if(mode === 'confirm'){
      if(k === 'Escape' || k === 'Backspace'){ e.preventDefault(); confirmCancel(); }
      else if(k === 'ArrowLeft' || k === 'ArrowUp'){ e.preventDefault(); cSel = 0; syncCBtns(); }
      else if(k === 'ArrowRight' || k === 'ArrowDown'){ e.preventDefault(); cSel = 1; syncCBtns(); }
      else if(k === 'Enter'){ e.preventDefault(); (cSel ? confirmOkRun : confirmCancel)(); }
    }
  });

  // 可变跳跃高度必须靠 keyup：松开跳跃键时若还在上升，就把速度截断
  window.addEventListener('keyup', e => {
    const kk = e.key.toLowerCase();
    keys[kk] = false;
    if(cutLock > 0) return;                          // 挣脱上冲期间不截断速度
    if(learn) return;                                // 习得二段跳的过场期间不截断速度
    if((kk === 'arrowup' || kk === 'w' || kk === ' ') && inLevel && hero.vy < PHYS.cutV) hero.vy = PHYS.cutV;
  });
  // 切走标签页时清空按键，避免回来后角色一直往一个方向跑
  window.addEventListener('blur', () => { for(const k in keys) delete keys[k]; });
  // 视口变化：重算世界缩放并重新钳制镜头
  window.addEventListener('resize', () => {
    stage.style.setProperty('--s', sc().toFixed(5));
    if(!inLevel) return;
    camX = clampCam(camX);
    render();
  });
</script>
</body>
